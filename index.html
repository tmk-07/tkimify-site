<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tkimify</title>
  <meta name="description" content="A compact project directory linking to tkimify project subdomains." />
  <meta name="theme-color" content="#080a0f" />
  <meta property="og:title" content="tkimify" />
  <meta property="og:description" content="A compact project directory for tkimify project sites." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="assets/logo_transparent.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar" id="top">
      <a class="brand" href="/" aria-label="tkimify home">
        <img src="assets/logo_transparent.png" alt="tkimify logo" />
        <span>tkimify</span>
      </a>

      <nav class="section-nav" aria-label="Site sections">
        <a href="#apps">apps</a>
        <a href="#tools">tools</a>
      </nav>
    </header>

    <div id="project-sections" class="project-sections"></div>

    <footer class="page-footer" aria-label="Footer">
      <a class="footer-icon-link gmail-link" href="https://mail.google.com/mail/?view=cm&fs=1&to=tkimify@gmail.com" target="_blank" rel="noopener noreferrer" aria-label="Email tkimify on Gmail">
        <svg class="gmail-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#EA4335" d="M2 6.75v10.5h4V10.1l6 4.5 6-4.5v7.15h4V6.75l-10 7.5z"></path>
          <path fill="#34A853" d="M18 17.25h4V6.75l-4 3z"></path>
          <path fill="#4285F4" d="M2 17.25h4v-7.15l-4-3z"></path>
          <path fill="#FBBC04" d="M18 6.75H6l6 4.5z"></path>
        </svg>
      </a>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
